server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes non-fichiers renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API -> backend FastAPI (http://backend:8000)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
