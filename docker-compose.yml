services:
  # ----------------------------------------------------------------------- #
  # Base de données / moteur de recherche
  # ----------------------------------------------------------------------- #
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------------- #
  # Modèles IA (Ollama) : embedding + rerank
  # ----------------------------------------------------------------------- #
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Accès GPU : voir docker-compose.gpu.yml (activé automatiquement par start.sh / start.ps1)

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3} && ollama pull ${RERANK_MODEL:-qwen3.5:4b}"]
    restart: "no"

  # ----------------------------------------------------------------------- #
  # Script d'indexation (one-shot)
  # ----------------------------------------------------------------------- #
  index_data:
    build: ./index_data
    container_name: index_data
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - EMBED_DIM=${EMBED_DIM:-1024}
      - N_CLUSTERS=${N_CLUSTERS:-5}
      - DATA_FILE=/data/objet_consultations_1000.txt
    volumes:
      - ./data:/data:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: "no"

  # ----------------------------------------------------------------------- #
  # Backend FastAPI
  # ----------------------------------------------------------------------- #
  backend:
    build: ./fastapi-backend
    container_name: backend
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - RERANK_MODEL=${RERANK_MODEL:-qwen3.5:4b}
      - N_PROBE=${N_PROBE:-1}
    ports:
      - "8000:8000"
      - "5678:5678"   # debugpy (TD2-3)
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      index_data:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------- #
  # Frontend React (TypeScript) servi par nginx
  # ----------------------------------------------------------------------- #
  front:
    build: ./react-front
    container_name: react-front
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_models:
